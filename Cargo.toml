[workspace]
resolver = "2"
members = ["crates/moldweaver-core", "crates/moldweaver"]
default-members = ["crates/moldweaver"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/kirmiziben10/moldweaver"
rust-version = "1.85"

[workspace.dependencies]
moldweaver-core = { path = "crates/moldweaver-core" }
manifold-rust = { version = "0.18.0", features = ["parallel"] }
glam = { version = "0.30", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
rayon = "1"
base64 = "0.22"
log = "0.4"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
