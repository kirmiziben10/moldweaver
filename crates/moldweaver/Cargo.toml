[package]
name = "moldweaver"
description = "Free, open-source silicone mold box generator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
moldweaver-core.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
egui-wgpu = "0.36.2"
bytemuck = { version = "1", features = ["derive"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster", "wayland"] }
dirs = "6"

[dev-dependencies]
zip.workspace = true
quick-xml.workspace = true
